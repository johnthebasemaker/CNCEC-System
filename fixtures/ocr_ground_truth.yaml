# fixtures/ocr_ground_truth.yaml — what these pages ACTUALLY say.
#
# ⚠️ THE EXPECTED VALUES ARE VERSIONED; THE IMAGES ARE NOT. The files under
# `fixtures/ocr/` are real signed company documents carrying employee names, a
# driver's name and a customer's project — they stay out of git (see
# `.gitignore`). This file is the half that must be reviewable in a diff,
# because it is the half that says whether a model got better or worse.
#
# ⚠️ AND `verified` IS NOT DECORATION. A ground truth somebody guessed is worse
# than no ground truth at all: it turns a model regression into a test failure
# nobody trusts, and a model improvement into a test failure somebody "fixes" by
# editing the expectation. Only fields confirmed against the image by a human
# are `verified: true`. Everything else is `verified: false` and MUST NOT be
# scored until the operator confirms it — see `pending_operator_review` at the
# foot of this file.
#
# Provenance: uploaded by the operator 2026-08-27/28 as `Trail Files/`, timed and
# transcribed through the live pipeline on 2026-09-02 (PROPOSED_PHASE11_PLAN §7.7).

meta:
  spec_version: 1
  created: '2026-09-02'
  # Where the images live locally. Restore with:
  #   cp "Trail Files/"* fixtures/ocr/
  image_dir: fixtures/ocr
  model_at_capture: qwen2.5vl:7b
  # The dev Mac, for reading the timings below. The Hetzner CPX42 is CPU-only
  # and will differ — re-measure there before quoting these to anyone.
  host_at_capture: 'Apple Silicon, 11.8 GiB VRAM, 28/29 layers on GPU'

documents:

  # ───────────────────────────────────────────────────────────────────────────
  - id: execution_entry_form
    file: Execution entry.pdf
    sha256: d1b56a7667e46bd90215ab093e1f857a76f3c790bf645c4de7e78791349cc17e
    lane: ocr_consumption_form          # POST /execution/ocr/upload
    endpoint: /execution/ocr/upload
    description: >-
      A genuine GI Phase-9c printed consumption form, filled digitally (typed
      into the PDF, not handwritten) and signed. This is the ONLY one of the
      three that carries a QR code, which is why it is the only one the
      Execution Entries lane will accept.
    measured:
      elapsed_s: 399
      image_tokens: 4399
      num_ctx: 8192
      num_predict: 2600
      outcome: every field correct
    expect:
      verified: true                    # read off the rendered page by a human
      qr_payload: 'GIF1|CNCEC|LSC1||32934F7226D44CBF'
      site_id: CNCEC
      lining_system_code: LSC1
      esc: ''                           # the form carries no sub-activity
      form_uuid: 32934F7226D44CBF
      work_date_text: '27/08/26'
      work_date_iso: '2026-08-27'
      equipment_text: TNK-071
      area_text: '10'
      area_sqm: 10.0
      filled_by: Johnson
      # No shift marker on this page — so `Shift` must stay NULL. A fixture
      # that expected 'Day' here would be asking the system to guess, which is
      # exactly what ruling P10-9 forbids.
      shift: null
      rows:
        - {row: 1, material: PR 304,          sap: '1047', qty_text: '5',  quantity: 5,  lot_text: '123'}
        - {row: 2, material: E40,             sap: '1046', qty_text: '5',  quantity: 5,  lot_text: '123'}
        - {row: 3, material: BC 3004,         sap: '1045', qty_text: '5',  quantity: 5,  lot_text: '345'}
        - {row: 4, material: Toluene,         sap: '1418', qty_text: '2',  quantity: 2,  lot_text: '0'}
        - {row: 5, material: Chemoline 4 ECN, sap: '1044', qty_text: '11', quantity: 11, lot_text: '567'}

  # ───────────────────────────────────────────────────────────────────────────
  - id: delivery_note
    file: Delivery Note.jpeg
    sha256: 5f40dc220c2dfec97766aa31d6d77c37e9724e4427ec02960c2c856d9999554d
    lane: ocr_delivery_note             # POST /ai/jobs?kind=ocr_delivery_note
    endpoint: /entry/ocr
    description: >-
      A GI pre-printed delivery note, machine-filled, with a handwritten
      signature. No QR code — it belongs to the OCR Import lane, not to
      Execution Entries. Twelve blank body rows below the four real ones, which
      the model must not invent items for.
    measured:
      elapsed_s: 92
      image_tokens: 2198
      num_ctx: 8192
      num_predict: 1536
      outcome: header and all four items exact; blank rows correctly skipped
    expect:
      verified: true
      header:
        DN_No: '13529'
        Date: '2026-08-25'
        Mob_From: MPC CNCEC PROJECT
        Driver_Name: ASGHAR
        Vehicle_No: '1188'
        Prepared_by: ESAM
        Mob_To: RAS AL KHAIR
      item_count: 4
      items:
        - {material_text: Rubber Sheet Roll 4E CN 4mm, uom: ROLL, quantity: 12}
        - {material_text: BC 3004,                     uom: Cans, quantity: 37}
        - {material_text: Hardener E40,                uom: BOX,  quantity: 28}
        - {material_text: Carbon Filler,               uom: Bags, quantity: 7}
      # ⚠️ THE SAP CODE NO COLUMN IS BLANK ON THE PAPER. Every line therefore
      # reaches `fuzzy.resolve_rows` with a description only. Rule 1 says the
      # component key is (Material_Code, SAP_Code), so a description-only match
      # can land on the wrong drum of a multi-part system — see Q8. Nothing here
      # asserts an auto-resolved SAP, deliberately.
      sap_codes_present: false

  # ───────────────────────────────────────────────────────────────────────────
  - id: consumption_paper
    file: Consumption paper.jpeg
    sha256: 4c8c4615d7aeedd2057c19d777b66aa60a24d18f3796b0cc0c0fa95dbf59cd84
    lane: ocr_consumption               # POST /ai/jobs?kind=ocr_consumption
    endpoint: /entry/ocr
    description: >-
      The handwritten PPE / consumables issue register — "MPC3P1-CNCEC PROJECT ·
      Daily - Consumption · Safety & Production Consumables". Thirty ruled rows,
      columns S.No | Name | Tank No.# | Product Name | UOM | QTY | Remarks, in
      biro, with heavy use of ditto marks down the Name, Tank No. and Product
      Name columns. No QR code.
    measured:
      elapsed_s: 212
      image_tokens: 2265
      num_ctx: 8192
      num_predict: 3072
      outcome: >-
        Parsed cleanly and was NOT truncated (7,023 raw chars inside a 3,072-token
        budget). Quantities and the date read correctly. Ditto cells came back as
        the empty string rather than a glyph — the defect fixed by spec R2a/R2b.
    expect:
      # ⚠️ TRANSCRIBED BY A HUMAN READ OF THE IMAGE, 2026-09-05, at 2-6x zoom on
      # every ambiguous cell. Previously `verified: false` with header-only
      # coverage, which meant per-cell OCR accuracy could not be scored at all.
      #
      # ⚠️ EACH CELL CARRIES BOTH `x_raw` AND `x`. `x_raw` is WHAT IS ON THE
      # PAPER — `<DITTO>` where the writer drew a ditto mark — and `x` is what a
      # human reads by carrying the value down the column. They are separate
      # fields because they measure different things: a model is scored on
      # `_raw` (did it SEE the mark?) and the resolver on `x` (did it CARRY the
      # value?), and the 11b bug lived exactly in the gap between them — the
      # model returned "" for the marks, so the resolver had nothing to carry
      # and 19/30 tank numbers vanished between a correct read and the grid.
      #
      # ⚠️ SIX CELLS ARE GENUINELY AMBIGUOUS and are commented inline with the
      # alternative reading. They are recorded as a best guess rather than
      # omitted, because a missing row scores as a miss and teaches nothing;
      # but a scorer should treat a mismatch on a commented cell as a question
      # about the transcription first and the model second.
      verified: true
      header:
        verified: true
        date_text: '25/08/26 (Night)'
        date_iso: '2026-08-25'
        # The word the crew wrote. Reading it is not the inference P10-9
        # forbids — it is the honest source P10-9 says old rows lack.
        shift: Night
        row_count: 30
      columns: [sno, name, tank_no, product_name, uom, qty, remarks]
      # ⚠️ THE UOM COLUMN IS DITTOED FROM ROW 11 ONWARD AND THEREFORE RESOLVES
      # TO "Nos" FOR GLOVES. That is what the paper says, and the ground truth
      # records the paper — not what the reader wishes it said. Do not "correct"
      # these to Pair: the fixture would then be scoring the model against an
      # opinion instead of a document.
      rows:
        # ⚠️ row 1: the writer's script capital G renders like a Y throughout (see 'Gloves')
        - {row: 1, name: "Sunil", name_raw: "Sunil", tank: "J091", tank_raw: "J091", product: "Green coated gloves", product_raw: "Green coated gloves", uom: "Pair", uom_raw: "Pair", qty: 1, remarks: "R/L", remarks_raw: "R/L"}
        - {row: 2, name: "Sunil", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "Dust Mask", uom: "Nos", uom_raw: "Nos", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 3, name: "Ram", name_raw: "Ram", tank: "J091", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 4, name: "Ram", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Green coated gloves", product_raw: "Green coated gloves", uom: "Pair", uom_raw: "Pair", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 5, name: "Vinoth", name_raw: "Vinoth", tank: "J091", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "Dust Mask", uom: "Nos", uom_raw: "Nos", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 6, name: "Vinoth", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 7, name: "Vinoth", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Gloves Leather", product_raw: "Gloves Leather", uom: "Pair", uom_raw: "Pair", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 8, name: "Rajeesh", name_raw: "Rajeesh", tank: "J091", tank_raw: "<DITTO>", product: "Gloves Leather", product_raw: "<DITTO>", uom: "Pair", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 9, name: "Rajeesh", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "Dust Mask", uom: "Nos", uom_raw: "Nos", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 10, name: "Rajeesh", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        # ⚠️ row 11: 'Green' is struck through IN THE CELL and 'Leather Gloves' stands. The ROW is not cancelled - spec R3 is about a line through the whole row
        - {row: 11, name: "Rajeesh", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Leather Gloves", product_raw: "Leather Gloves", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 12, name: "Yaseen", name_raw: "Yaseen", tank: "J091", tank_raw: "<DITTO>", product: "Leather Gloves", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 13, name: "Vikas", name_raw: "Vikas", tank: "J091", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "Dust Mask", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        # ⚠️ row 14: name AMBIGUOUS: 'Gundey' / 'Gunday'. Same initial glyph as the G in 'Gloves'
        - {row: 14, name: "Gundey", name_raw: "Gundey", tank: "J091", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 5, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 15, name: "Gundey", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Leather Gloves", product_raw: "Leather Gloves", uom: "Nos", uom_raw: "<DITTO>", qty: 5, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 16, name: "Gundey", name_raw: "<DITTO>", tank: "J091", tank_raw: "<DITTO>", product: "Grinding Disc G36", product_raw: "Grinding Disc G36", uom: "Nos", uom_raw: "<DITTO>", qty: 2, remarks: "R/L", remarks_raw: "<DITTO>"}
        # ⚠️ row 17: name AMBIGUOUS: 'Sonu' / 'Sohu'
        - {row: 17, name: "Sonu", name_raw: "Sonu", tank: "J091", tank_raw: "<DITTO>", product: "Leather Gloves", product_raw: "Leather Gloves", uom: "Nos", uom_raw: "<DITTO>", qty: 2, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 18, name: "Rajendra", name_raw: "Rajendra", tank: "J027", tank_raw: "J027", product: "Leather Gloves", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "Blast", remarks_raw: "Blast"}
        - {row: 19, name: "Rajendra", name_raw: "<DITTO>", tank: "J027", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "Dust Mask", uom: "Nos", uom_raw: "<DITTO>", qty: 8, remarks: "Blast", remarks_raw: "<DITTO>"}
        - {row: 20, name: "Rajendra", name_raw: "<DITTO>", tank: "J027", tank_raw: "<DITTO>", product: "Earplugs", product_raw: "Earplugs", uom: "Nos", uom_raw: "<DITTO>", qty: 8, remarks: "Blast", remarks_raw: "<DITTO>"}
        - {row: 21, name: "Rajendra", name_raw: "<DITTO>", tank: "J027", tank_raw: "<DITTO>", product: "Broom Brush Black", product_raw: "Broom Brush Black", uom: "Nos", uom_raw: "<DITTO>", qty: 4, remarks: "Blast", remarks_raw: "<DITTO>"}
        - {row: 22, name: "Rajendra", name_raw: "<DITTO>", tank: "J027", tank_raw: "<DITTO>", product: "Tyvek coverall", product_raw: "Tyvek coverall", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "Blast", remarks_raw: "<DITTO>"}
        # ⚠️ row 23: tank AMBIGUOUS: reads J291; row 1's J091 has a round 0 where this has an angular 2
        - {row: 23, name: "Pappu", name_raw: "Pappu", tank: "J291", tank_raw: "J291", product: "Leather Gloves", product_raw: "Leather Gloves", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "R/L"}
        - {row: 24, name: "Akram", name_raw: "Akram", tank: "J291", tank_raw: "<DITTO>", product: "Leather Gloves", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 5, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 25, name: "Akram", name_raw: "<DITTO>", tank: "J291", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "Dust Mask", uom: "Nos", uom_raw: "<DITTO>", qty: 5, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 26, name: "Vijay", name_raw: "Vijay", tank: "J291", tank_raw: "<DITTO>", product: "Leather Gloves", product_raw: "Leather Gloves", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 27, name: "Krishna", name_raw: "Krishna", tank: "J291", tank_raw: "<DITTO>", product: "Leather Gloves", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 28, name: "Krishna", name_raw: "<DITTO>", tank: "J291", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "Dust Mask", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        # ⚠️ row 29: name AMBIGUOUS: 'Indiyan' / 'Indiyang' - trailing flourish
        - {row: 29, name: "Indiyan", name_raw: "Indiyan", tank: "J291", tank_raw: "<DITTO>", product: "Dust Mask", product_raw: "<DITTO>", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}
        - {row: 30, name: "Indiyan", name_raw: "<DITTO>", tank: "J291", tank_raw: "<DITTO>", product: "Leather Gloves", product_raw: "Leather Gloves", uom: "Nos", uom_raw: "<DITTO>", qty: 1, remarks: "R/L", remarks_raw: "<DITTO>"}

      # What the SHAPE of a correct read must be — scoreable independently of
      # the per-cell transcription above, and the properties the 11b fix is
      # actually about.
      structure:
        verified: true
        rows_returned_min: 25
        ditto_columns: [received_by, tank_no, product_name, work_type]
        blank_before_fix:
          tank_no: 19
          received_by: 14
          product_name: 8
        after_fix:
          populated_rows_with_blank_ditto_column: 0
          inferred_cells_flagged: INFO_DITTO_INFERRED
        # ⚠️ AND THE EMPTY TAIL MUST STAY EMPTY. Not applicable to THIS sheet —
        # all 30 rows are written on — but the property is pinned in suite AM
        # because the S.No column is pre-printed on every sheet.
        unwritten_rows_must_stay_blank: true

# ⚠️ WHAT A HUMAN STILL HAS TO CONFIRM BEFORE IT CAN BE SCORED.
#
# Listed explicitly rather than left implicit, because the failure mode here is
# a fixture that quietly becomes authoritative without anybody having checked
# it. Until these are done, `consumption_paper.expect.verified` stays false and
# a runner must skip the per-cell comparison (and SAY that it skipped it — a
# skip is not a pass; see legacy/bug_check.py's SkipCheck).
pending_operator_review:
  # ✅ CLOSED 2026-09-05 — the 30 rows are transcribed above and `verified` is
  # true, so per-cell accuracy is now scoreable. What remains is a CONFIRMATION,
  # not a transcription: six cells are genuinely ambiguous to a reader who does
  # not know the crew, and they are commented inline in the rows.
  - document: consumption_paper
    needs: >-
      An operator who knows the site to confirm six readings: the names on rows
      14 ("Gundey"/"Gunday"), 17 ("Sonu"/"Sohu") and 29
      ("Indiyan"/"Indiyang"), and the tank number on row 23 (read as J291,
      where row 1's J091 has a round 0 in the position this has an angular 2).
      Everything else was read at 2-6x zoom and is unambiguous. ⚠️ Correct them
      HERE if wrong — do not relax a scorer to accommodate a bad
      transcription.
  - document: delivery_note
    needs: >-
      A ruling on Q8 — whether a DN line may auto-resolve to a SAP code by
      description similarity, or must always be confirmed by a human. Until
      that is answered no SAP expectations are recorded here.
