<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F5F7FA;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-title"
        class="scene"
        data-composition-id="01-title"
        data-composition-src="compositions/frames/01-title.html"
        data-start="0"
        data-duration="5.6"
        data-track-index="0"
      ></div>

      <div
        id="el-02-estimator"
        class="scene"
        data-composition-id="02-estimator"
        data-composition-src="compositions/frames/02-estimator.html"
        data-start="5"
        data-duration="6.6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-assets"
        class="scene"
        data-composition-id="03-assets"
        data-composition-src="compositions/frames/03-assets.html"
        data-start="11"
        data-duration="7.6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-access"
        class="scene"
        data-composition-id="04-access"
        data-composition-src="compositions/frames/04-access.html"
        data-start="18"
        data-duration="6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-lockup"
        class="scene"
        data-composition-id="05-lockup"
        data-composition-src="compositions/frames/05-lockup.html"
        data-start="24"
        data-duration="6"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-title", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 5);
        tl.fromTo("#el-02-estimator", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 5);
        tl.to("#el-02-estimator", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 11);
        tl.fromTo("#el-03-assets", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 11);
        tl.to("#el-03-assets", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 18);
        tl.fromTo("#el-04-access", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 18);
        tl.to({}, { duration: 30 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
