    <style>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        const id = '[data-composition-id="02-estimator"]';
        const tl = gsap.timeline({ paused: true });

        // handoff_in: the carrier hairline arrives at y=778 static, then rises to y=130.
        tl.fromTo(
          id + " #e02-rule",
          { y: 0, opacity: 1 },
          { y: -648, duration: 0.95, ease: "power2.inOut" },
          0.18
        );

        // Scene 1 (0.0-1.2s) — chip, then headline.
        tl.fromTo(
          id + " #e02-chip",
          { yPercent: 115, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.1
        );
        tl.fromTo(
          id + " #e02-head",
          { yPercent: 108, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
          0.36
        );

        // Scene 2 (1.2-2.6s) — mirrored book-open entry from opposite wings.
        tl.fromTo(
          id + " #e02-colA",
          { x: -230, rotationY: 42, opacity: 0 },
          {
            x: 0,
            rotationY: 0,
            opacity: 1,
            duration: 0.78,
            ease: "power3.out",
          },
          1.2
        );
        tl.fromTo(
          id + " #e02-colB",
          { x: 230, rotationY: -42, opacity: 0 },
          {
            x: 0,
            rotationY: 0,
            opacity: 1,
            duration: 0.78,
            ease: "power3.out",
          },
          1.2
        );

        // Scene 3 (2.6-3.8s) — each tier fills from its own baseline, independently.
        tl.fromTo(
          id + " #e02-fillA",
          { scaleY: 0 },
          { scaleY: 1, duration: 0.85, ease: "power3.out" },
          2.6
        );
        tl.fromTo(
          id + " #e02-fillB",
          { scaleY: 0 },
          { scaleY: 1, duration: 0.85, ease: "power3.out" },
          2.76
        );
        tl.fromTo(
          id + " #e02-b1",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          2.72
        );

        // Scene 4 (3.8-5.0s) — inner-edge badges spring-pop on each column.
        tl.fromTo(
          id + " #e02-badgeA",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" },
          3.85
        );
        tl.fromTo(
          id + " #e02-badgeB",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" },
          4.0
        );
        tl.fromTo(
          id + " #e02-b2",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          3.95
        );

        // Scene 5 (5.0-6.0s) — 1,313 counts up. Seek-safe onUpdate + Math.round.
        const numEl = document.querySelector(id + " #e02-statnum");
        const counter = { v: 0 };
        tl.fromTo(
          id + " .e02-stat",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          4.9
        );
        tl.to(
          counter,
          {
            v: 1313,
            duration: 0.85,
            ease: "power2.out",
            onUpdate: function () {
              if (numEl) {
                numEl.textContent = Math.round(counter.v).toLocaleString("en-US");
              }
            },
          },
          5.0
        );

        // Holds still on the two separated tiers.

        window.__timelines = window.__timelines || {};
        window.__timelines["02-estimator"] = tl;
      })();
    </script>

</template>
