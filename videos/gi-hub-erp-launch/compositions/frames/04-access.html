<template id="frame-04-access-template">
  <div
    id="root"
    data-composition-id="04-access"
    data-width="1920"
    data-height="1080"
    data-duration="6"
  >
    <div
      id="x04-ground" class="clip x04-ground"
      data-start="0"
      data-duration="6"
      data-track-index="0"
    >
      <div class="x04-grid"></div>
    </div>

    <!-- carried hairline: static at y=130 for the whole frame -->
    <div
      id="x04-rulewrap" class="clip x04-rulewrap"
      data-start="0"
      data-duration="6"
      data-track-index="1"
    >
      <div class="x04-rule"></div>
    </div>

    <div
      id="x04-left" class="clip x04-left"
      data-start="0"
      data-duration="6"
      data-track-index="2"
    >
      <div class="x04-chipmask">
        <div class="x04-chip" id="x04-chip">03 &nbsp;—&nbsp; Enforced Role-Based Access</div>
      </div>
      <div class="x04-headmask">
        <div class="x04-head" id="x04-head">permission by design,<br />not by memory.</div>
      </div>

      <div class="x04-bullets">
        <div class="x04-bulletmask">
          <div class="x04-bullet" id="x04-b1">
            <span class="x04-slash">/</span>Enforced centrally &mdash; never screen by screen
          </div>
        </div>
        <div class="x04-bulletmask">
          <div class="x04-bullet" id="x04-b2">
            <span class="x04-slash">/</span>View-only accounts cannot change data
          </div>
        </div>
        <div class="x04-bulletmask">
          <div class="x04-bullet x04-bullet-key" id="x04-b3">
            <span class="x04-slash">/</span>Locked down the day it is written
          </div>
        </div>
      </div>
    </div>

    <!-- the shield draws itself, and the ratio counts up inside it -->
    <div
      id="x04-shieldwrap" class="clip x04-shieldwrap"
      data-start="0"
      data-duration="6"
      data-track-index="3"
    >
      <div class="x04-bloom" id="x04-bloom"></div>
      <svg class="x04-shield" viewBox="0 0 300 350">
        <path
          id="x04-shieldpath"
          d="M150 8 L286 62 L286 176 C286 258 224 312 150 342 C76 312 14 258 14 176 L14 62 Z"
        />
      </svg>
      <div class="x04-readout">
        <div class="x04-num" id="x04-num">0</div>
        <div class="x04-denom">/ 143</div>
        <div class="x04-caption">actions blocked</div>
      </div>
    </div>

    <style>
      #root {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      .x04-ground {
        position: absolute;
        inset: 0;
        background: #0b0d10;
      }
      .x04-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(245, 247, 250, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(245, 247, 250, 0.05) 1px, transparent 1px);
        background-size: 80px 80px;
      }

      .x04-rulewrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .x04-rule {
        position: absolute;
        left: 0;
        top: 130px;
        width: 1920px;
        height: 2px;
        background: #f0b429;
      }

      .x04-left {
        position: absolute;
        left: 132px;
        top: 262px;
        width: 760px;
      }
      .x04-chipmask,
      .x04-headmask,
      .x04-bulletmask {
        overflow: hidden;
      }
      .x04-chip {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f0b429;
        opacity: 0;
        padding-bottom: 4px;
      }
      .x04-head {
        margin-top: 26px;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 86px;
        line-height: 1.06;
        letter-spacing: -0.03em;
        color: #f5f7fa;
        opacity: 0;
        padding-bottom: 12px;
      }
      .x04-bullets {
        margin-top: 52px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .x04-bullet {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 30px;
        line-height: 1.45;
        color: #a8adb6;
        opacity: 0;
        padding-bottom: 6px;
      }
      .x04-bullet-key {
        color: #f5f7fa;
        font-weight: 700;
      }
      .x04-slash {
        font-family: "IBM Plex Mono", monospace;
        color: #f0b429;
        margin-right: 18px;
      }

      /* ---- shield + readout ---- */
      .x04-shieldwrap {
        position: absolute;
        left: 1120px;
        top: 236px;
        width: 620px;
        height: 480px;
      }
      .x04-bloom {
        position: absolute;
        left: 60px;
        top: 20px;
        width: 500px;
        height: 440px;
        opacity: 0;
        background: radial-gradient(
          ellipse 50% 50% at 50% 50%,
          rgba(240, 180, 41, 0.3),
          rgba(11, 13, 16, 0) 70%
        );
      }
      .x04-shield {
        position: absolute;
        left: 160px;
        top: 42px;
        width: 300px;
        height: 350px;
      }
      .x04-shield path {
        fill: none;
        stroke: #f0b429;
        stroke-width: 2.5;
      }
      .x04-readout {
        position: absolute;
        left: 160px;
        top: 130px;
        width: 300px;
        text-align: center;
      }
      .x04-num {
        font-family: "Inter", sans-serif;
        font-weight: 900;
        font-size: 116px;
        line-height: 1.18;
        height: 137px;
        letter-spacing: -0.05em;
        color: #f5f7fa;
        font-variant-numeric: tabular-nums;
        opacity: 0;
      }
      .x04-denom {
        margin-top: 16px;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 40px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #7e838c;
        font-variant-numeric: tabular-nums;
        opacity: 0;
      }
      .x04-caption {
        margin-top: 18px;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 18px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f0b429;
        opacity: 0;
      }
    </style>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        const id = '[data-composition-id="04-access"]';
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.1s) — chip then headline.
        tl.fromTo(
          id + " #x04-chip",
          { yPercent: 115, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
          0.1
        );
        tl.fromTo(
          id + " #x04-head",
          { yPercent: 108, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
          0.34
        );

        // Scene 2 (1.1-2.4s) — the shield draws itself, apex to point.
        const path = document.querySelector(id + " #x04-shieldpath");
        if (path) {
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;
          tl.fromTo(
            path,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: 1.25, ease: "power2.inOut" },
            1.1
          );
        }

        // Scene 3 (2.4-4.0s) — 126 counts up and stops hard; /143 never animates.
        const numEl = document.querySelector(id + " #x04-num");
        const counter = { v: 0 };
        tl.fromTo(
          id + " #x04-num",
          { opacity: 0, scale: 0.86 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
          2.4
        );
        tl.to(
          counter,
          {
            v: 126,
            duration: 1.15,
            ease: "power2.out",
            onUpdate: function () {
              if (numEl) numEl.textContent = Math.round(counter.v);
            },
          },
          2.4
        );
        tl.fromTo(
          id + " .x04-denom",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          2.62
        );
        tl.fromTo(
          id + " #x04-b1",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.56, ease: "power3.out" },
          2.5
        );

        // Scene 4 (4.0-5.0s) — the bloom rises behind the shield and settles.
        tl.fromTo(
          id + " #x04-bloom",
          { opacity: 0, scale: 0.82 },
          { opacity: 1, scale: 1, duration: 0.85, ease: "power2.out" },
          3.95
        );
        tl.fromTo(
          id + " .x04-caption",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          4.05
        );
        tl.fromTo(
          id + " #x04-b2",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.56, ease: "power3.out" },
          4.0
        );

        // Scene 5 (5.0-6.0s) — the closing line lands; the frame then holds STILL.
        tl.fromTo(
          id + " #x04-b3",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          5.0
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["04-access"] = tl;
      })();
    </script>
  </div>
</template>
