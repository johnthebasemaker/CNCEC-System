<template id="frame-03-assets-template">
  <div
    id="root"
    data-composition-id="03-assets"
    data-width="1920"
    data-height="1080"
    data-duration="7.6"
  >
    <div
      id="a03-ground" class="clip a03-ground"
      data-start="0"
      data-duration="7.6"
      data-track-index="0"
    >
      <div class="a03-grid"></div>
    </div>

    <!-- carried hairline: static at y=130 for the whole frame -->
    <div
      id="a03-rulewrap" class="clip a03-rulewrap"
      data-start="0"
      data-duration="7.6"
      data-track-index="1"
    >
      <div class="a03-rule"></div>
    </div>

    <div
      id="a03-left" class="clip a03-left"
      data-start="0"
      data-duration="7.6"
      data-track-index="2"
    >
      <div class="a03-chipmask">
        <div class="a03-chip" id="a03-chip">02 &nbsp;—&nbsp; Asset &amp; Tool Geolocation</div>
      </div>
      <div class="a03-headmask">
        <div class="a03-head" id="a03-head">every tool,<br />tracked to the shelf.</div>
      </div>

      <div class="a03-bullets">
        <div class="a03-bulletmask">
          <div class="a03-bullet" id="a03-b1">
            <span class="a03-slash">/</span>Serialised assets, full custody history
          </div>
        </div>
        <div class="a03-bulletmask">
          <div class="a03-bullet" id="a03-b2">
            <span class="a03-slash">/</span>GPS-tagged the moment a tool moves
          </div>
        </div>
        <div class="a03-bulletmask">
          <div class="a03-bullet a03-bullet-key" id="a03-b3">
            <span class="a03-slash">/</span>Scan a rack, see everything on it
          </div>
        </div>
      </div>
    </div>

    <!-- the rack elevation: cells self-assemble, a sweep passes, one cell latches -->
    <div
      id="a03-rack" class="clip a03-rack"
      data-start="0"
      data-duration="7.6"
      data-track-index="3"
    >
      <div class="a03-cells" id="a03-cells"></div>
      <div class="a03-lit" id="a03-lit"></div>
      <div class="a03-sweep" id="a03-sweep"></div>
      <div class="a03-pin" id="a03-pin">
        <svg viewBox="0 0 32 40" class="a03-pinsvg">
          <path
            d="M16 1 C8 1 2 7 2 15 C2 25 16 39 16 39 C16 39 30 25 30 15 C30 7 24 1 16 1 Z"
          />
          <circle cx="16" cy="15" r="5" class="a03-pinhole" />
        </svg>
      </div>
      <div class="a03-pulse" id="a03-pulse"></div>
    </div>

    <!-- the checklist the Locator hands back -->
    <div
      id="a03-checks" class="clip a03-checks"
      data-start="0"
      data-duration="7.6"
      data-track-index="4"
    >
      <div class="a03-checkmask">
        <div class="a03-check" id="a03-c1"><span class="a03-tick">&#10003;</span>Torque wrench &middot; 4 of 4</div>
      </div>
      <div class="a03-checkmask">
        <div class="a03-check" id="a03-c2"><span class="a03-tick">&#10003;</span>Impact driver &middot; 2 of 2</div>
      </div>
      <div class="a03-checkmask">
        <div class="a03-check" id="a03-c3"><span class="a03-tick">&#10003;</span>Pressure gauge &middot; 1 of 1</div>
      </div>
    </div>

    <style>
      #root {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Inter", sans-serif;
      }

      .a03-ground {
        position: absolute;
        inset: 0;
        background: #0b0d10;
      }
      .a03-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(245, 247, 250, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(245, 247, 250, 0.05) 1px, transparent 1px);
        background-size: 80px 80px;
      }

      .a03-rulewrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .a03-rule {
        position: absolute;
        left: 0;
        top: 130px;
        width: 1920px;
        height: 2px;
        background: #f0b429;
      }

      .a03-left {
        position: absolute;
        left: 132px;
        top: 250px;
        width: 700px;
      }
      .a03-chipmask,
      .a03-headmask,
      .a03-bulletmask,
      .a03-checkmask {
        overflow: hidden;
      }
      .a03-chip {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f0b429;
        opacity: 0;
        padding-bottom: 4px;
      }
      .a03-head {
        margin-top: 26px;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 88px;
        line-height: 1.06;
        letter-spacing: -0.03em;
        color: #f5f7fa;
        opacity: 0;
        padding-bottom: 12px;
      }
      .a03-bullets {
        margin-top: 52px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .a03-bullet {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 30px;
        line-height: 1.45;
        color: #a8adb6;
        opacity: 0;
        padding-bottom: 6px;
      }
      .a03-bullet-key {
        color: #f5f7fa;
        font-weight: 700;
      }
      .a03-slash {
        font-family: "IBM Plex Mono", monospace;
        color: #f0b429;
        margin-right: 18px;
      }

      /* ---- the rack ---- */
      .a03-rack {
        position: absolute;
        left: 980px;
        top: 250px;
        width: 800px;
        height: 500px;
      }
      .a03-cells {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 10px;
      }
      .a03-cell {
        border: 1px solid #4a4740;
        background: rgba(245, 247, 250, 0.028);
        opacity: 0;
        position: relative;
      }
      /* the located cell — a tweened overlay, seek-safe in both directions */
      .a03-lit {
        position: absolute;
        left: 324px;
        top: 255px;
        width: 152px;
        height: 117.5px;
        border: 2px solid #f0b429;
        background: rgba(240, 180, 41, 0.16);
        opacity: 0;
      }
      .a03-sweep {
        position: absolute;
        top: -6px;
        bottom: -6px;
        left: 0;
        width: 150px;
        opacity: 0;
        background: linear-gradient(
          to right,
          rgba(56, 189, 248, 0) 0%,
          rgba(56, 189, 248, 0.14) 42%,
          rgba(56, 189, 248, 0.55) 76%,
          rgba(56, 189, 248, 0.95) 96%,
          rgba(56, 189, 248, 0) 100%
        );
      }
      .a03-pin {
        position: absolute;
        left: 378px;
        top: 192px;
        width: 44px;
        height: 55px;
        opacity: 0;
      }
      .a03-pinsvg {
        width: 44px;
        height: 55px;
      }
      .a03-pinsvg path {
        fill: #f0b429;
      }
      .a03-pinhole {
        fill: #0b0d10;
      }
      .a03-pulse {
        position: absolute;
        left: 362px;
        top: 276px;
        width: 76px;
        height: 76px;
        border: 2px solid #f0b429;
        border-radius: 50%;
        opacity: 0;
      }

      /* ---- checklist ---- */
      .a03-checks {
        position: absolute;
        left: 980px;
        top: 786px;
        width: 800px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .a03-check {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.05em;
        color: #a8adb6;
        opacity: 0;
        padding-bottom: 4px;
      }
      .a03-tick {
        color: #f0b429;
        margin-right: 16px;
      }
    </style>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        const id = '[data-composition-id="03-assets"]';
        const tl = gsap.timeline({ paused: true });

        // Build the rack cells deterministically (fixed count, no randomness).
        const CELLS = 20;
        const holder = document.querySelector(id + " #a03-cells");
        if (holder && holder.children.length === 0) {
          for (let i = 0; i < CELLS; i++) {
            const c = document.createElement("div");
            c.className = "a03-cell";
            holder.appendChild(c);
          }
        }

        // Scene 1 (0.0-1.2s) — chip then headline.
        tl.fromTo(
          id + " #a03-chip",
          { yPercent: 115, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.1
        );
        tl.fromTo(
          id + " #a03-head",
          { yPercent: 108, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
          0.36
        );

        // Scene 2 (1.2-2.8s) — the rack self-assembles cell by cell, in reading order.
        tl.fromTo(
          id + " .a03-cell",
          { opacity: 0, scale: 0.72, z: -160 },
          {
            opacity: 1,
            scale: 1,
            z: 0,
            duration: 0.5,
            stagger: 0.052,
            ease: "power3.out",
          },
          1.2
        );

        // Scene 3 (2.8-4.0s) — the cyan scan sweep crosses the rack.
        tl.fromTo(
          id + " #a03-sweep",
          { x: -170, opacity: 0 },
          { opacity: 1, duration: 0.22, ease: "power1.out" },
          2.8
        );
        tl.to(
          id + " #a03-sweep",
          { x: 810, duration: 1.15, ease: "power1.inOut" },
          2.8
        );
        tl.to(
          id + " #a03-sweep",
          { opacity: 0, duration: 0.24, ease: "power1.in" },
          3.78
        );
        tl.fromTo(
          id + " #a03-b1",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          2.9
        );

        // Scene 4 (4.0-5.4s) — the sweep passes, one cell latches gold, the pin pops and pulses.
        tl.fromTo(
          id + " #a03-lit",
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power2.out" },
          3.95
        );
        tl.fromTo(
          id + " #a03-pin",
          { scale: 0, opacity: 0, transformOrigin: "50% 100%" },
          {
            scale: 1,
            opacity: 1,
            duration: 0.5,
            ease: "back.out(2)",
          },
          4.05
        );
        // two finite pulses — bloom out and fade, never a repeating loop
        tl.fromTo(
          id + " #a03-pulse",
          { scale: 0.45, opacity: 0.85 },
          { scale: 1.5, opacity: 0, duration: 0.72, ease: "power2.out" },
          4.3
        );
        tl.fromTo(
          id + " #a03-pulse",
          { scale: 0.45, opacity: 0.7 },
          { scale: 1.5, opacity: 0, duration: 0.72, ease: "power2.out" },
          4.86
        );
        tl.fromTo(
          id + " #a03-b2",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          4.2
        );

        // Scene 5 (5.4-7.0s) — the checklist waterfalls in, row by row.
        tl.fromTo(
          id + " #a03-b3",
          { yPercent: 112, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.58, ease: "power3.out" },
          5.4
        );
        tl.fromTo(
          id + " .a03-check",
          { yPercent: 115, opacity: 0 },
          {
            yPercent: 0,
            opacity: 1,
            duration: 0.52,
            stagger: 0.16,
            ease: "power3.out",
          },
          5.5
        );

        // Holds still with the one cell lit.

        window.__timelines = window.__timelines || {};
        window.__timelines["03-assets"] = tl;
      })();
    </script>
  </div>
</template>
