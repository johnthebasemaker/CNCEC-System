# ============================================================================
# release-desktop.yml — Tauri desktop installers → GitHub Release assets
# ----------------------------------------------------------------------------
# Adapted from the "Powerful Weapon" (Bible project) build.yml pipeline:
#   * per-OS build jobs upload artifacts,
#   * a tag-gated release job (contents: write) attaches them to the Release
#     via softprops/action-gh-release (created on first touch of the tag).
# Deliberate deviation from the reference: NO build on every main push —
# macOS/Windows Rust builds are expensive and Postgres dual-CI already guards
# main. Trigger = version tags (v*) or a manual run.
#
# The Android .apk lands on the SAME release from release-android.yml.
# ============================================================================
name: Release desktop (Tauri)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-desktop:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS .dmg
            artifact: GI-Hub-macOS
          - os: windows-latest
            label: Windows .exe
            artifact: GI-Hub-Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      # Tauri names every installer from tauri.conf.json's `version`, NOT from
      # the tag — which is how tag v1.2.0 shipped assets called
      # "GI Hub_0.1.0_x64-setup.exe" and left nobody able to tell which build
      # an installer came from. Three files carry the number and all three had
      # drifted apart (0.1.0 / 0.1.0 / 0.0.0). Fail the build here rather than
      # publish a mislabelled installer: a wrong version on a released binary
      # cannot be corrected after someone has installed it.
      - name: Check the version matches the tag
        working-directory: frontend
        shell: bash
        run: |
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json=$CONF  package.json=$PKG  Cargo.toml=$CARGO"
          if [ "$CONF" != "$PKG" ] || [ "$CONF" != "$CARGO" ]; then
            echo "::error title=version drift::tauri.conf.json ($CONF), package.json ($PKG) and Cargo.toml ($CARGO) must all match"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$CONF" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error title=version drift::tag ${GITHUB_REF_NAME} does not match version $CONF — bump the three files before tagging"
            exit 1
          fi

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # `tauri build` runs beforeBuildCommand (npm run build → vite dist/)
      # and then bundles: dmg+app on macOS, nsis .exe + .msi on Windows.
      # VITE_API_URL points the standalone binaries at the hosted backend —
      # inside a tauri://localhost shell, relative /api paths resolve nowhere.
      - name: Build installers
        working-directory: frontend
        env:
          VITE_API_URL: https://gi.giinventory.com/api
        run: npx tauri build

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: error

  # Only fires on a version tag (v0.1.0 …) — attaches the installers to the
  # GitHub Release for that tag (creating it if this job gets there first;
  # release-android.yml appends the .apk to the same release).
  release:
    name: Publish GitHub Release
    needs: [build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/GI-Hub-macOS/*.dmg
            artifacts/GI-Hub-Windows/**/*.exe
            artifacts/GI-Hub-Windows/**/*.msi
          generate_release_notes: true
