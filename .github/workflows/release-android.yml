# ============================================================================
# release-android.yml — Capacitor Android .apk → GitHub Release assets
# ----------------------------------------------------------------------------
# Same reference pipeline shape as release-desktop.yml (build → artifact →
# tag-gated release append). The android/ native project is GITIGNORED by
# design (frontend/.gitignore), so the runner regenerates it fresh with
# `npx cap add android` on every build — no drift, no 50 MB of checked-in
# Gradle template.
#
# Output is the DEBUG-signed APK: installable directly on any Android device
# (perfect for internal sideloading). Play-Store distribution would need a
# release keystore + assembleRelease — deliberately out of scope for now.
# ============================================================================
name: Release Android (Capacitor)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Re-running a tag (or pushing it twice) must not race two builds onto the
# same GitHub Release.
concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android .apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 8 compiles with JavaVersion.VERSION_21 (hardcoded in
      # @capacitor/android's build.gradle) — JDK 17 dies with "invalid source
      # release: 21". This was the v0.1.0–v1.0.1 release failure.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest runners ship the Android SDK (ANDROID_HOME preset);
      # Gradle downloads the exact platform/build-tools it needs on first run.

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # VITE_API_URL points the APK at the hosted backend — inside the
      # Capacitor webview (origin https://localhost) relative /api paths
      # resolve nowhere.
      - name: Build web assets
        working-directory: frontend
        env:
          VITE_API_URL: https://gi.giinventory.com/api
        run: npm run build

      - name: Generate the native Android project
        working-directory: frontend
        run: npx cap add android

      - name: Sync web assets into the shell
        working-directory: frontend
        run: npx cap sync android

      # `cap add android` writes versionName "1.0" / versionCode 1 from
      # Capacitor's own template, and android/ is gitignored (regenerated every
      # build), so there is no checked-in file to correct — the workflow is the
      # only place that CAN own the APK's internal version. Without this the
      # v1.2.0 release installed as "1.0" and Android refused the upgrade,
      # because it compares versionCode and 1 is never greater than 1.
      #
      # versionCode must be a monotonically increasing integer, so the semver
      # is packed positionally: 1.2.0 → 10200. Two digits per component caps a
      # component at 99, which is far beyond anything this project will reach.
      - name: Stamp the release version into the Android project
        working-directory: frontend/android
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('../package.json').version")"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "versionName=$VERSION versionCode=$CODE"
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" app/build.gradle
          sed -i "s/versionCode .*/versionCode ${CODE}/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      # On failure, surface Gradle's "What went wrong" section as ::error::
      # annotations — run LOGS need a signed-in session, annotations don't.
      - name: Assemble debug APK
        working-directory: frontend/android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            grep -B1 -A8 "What went wrong" "$RUNNER_TEMP/gradle.log" | head -10 \
              | while IFS= read -r line; do echo "::error title=gradle::${line}"; done
            exit 1
          fi

      # Stamp the version into the FILENAME. Every release so far produced an
      # identically-named asset, so the Releases page gave no way to tell which
      # build an installer came from. A manual dispatch is labelled by commit.
      - name: Rename APK
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p out
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk \
             "out/GI-Hub-${VERSION}-android.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GI-Hub-Android
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach APK to GitHub Release
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/GI-Hub-Android/*.apk
          generate_release_notes: true
