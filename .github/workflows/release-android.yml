# ============================================================================
# release-android.yml — Capacitor Android .apk → GitHub Release assets
# ----------------------------------------------------------------------------
# Same reference pipeline shape as release-desktop.yml (build → artifact →
# tag-gated release append). The android/ native project is GITIGNORED by
# design (frontend/.gitignore), so the runner regenerates it fresh with
# `npx cap add android` on every build — no drift, no 50 MB of checked-in
# Gradle template.
#
# Output is the DEBUG-signed APK: installable directly on any Android device
# (perfect for internal sideloading). Play-Store distribution would need a
# release keystore + assembleRelease — deliberately out of scope for now.
# ============================================================================
name: Release Android (Capacitor)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-android:
    name: Build Android .apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship the Android SDK (ANDROID_HOME preset);
      # Gradle downloads the exact platform/build-tools it needs on first run.

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        working-directory: frontend
        run: npm run build

      - name: Generate the native Android project
        working-directory: frontend
        run: npx cap add android

      - name: Sync web assets into the shell
        working-directory: frontend
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk out/GI-Hub-android.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GI-Hub-Android
          path: out/GI-Hub-android.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Attach APK to GitHub Release
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/GI-Hub-Android/*.apk
          generate_release_notes: true
