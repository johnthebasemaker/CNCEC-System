[package]
name = "app"
# Kept in step with tauri.conf.json and package.json — all three must read the
# same number. `tauri build` names every installer from tauri.conf.json's
# `version`, which is how v1.2.0 shipped as "GI Hub_0.1.0_x64-setup.exe".
version = "1.2.0"
description = "GI Hub — multi-site warehouse inventory and asset-management ERP"
authors = ["General Industries"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
